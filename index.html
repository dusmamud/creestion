<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Creestion Studio — free manual editor for app store screenshots. Upload screens for iPhone, iPad, Android, Mac, and Windows, edit headlines, and export full-resolution PNGs. No signup." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Creestion" />
    <meta property="og:title" content="Creestion Studio — App Store Screenshot Editor" />
    <meta property="og:description" content="Design app store screenshots in your browser. Exact-size canvases for iPhone, iPad, Android, Mac, and Windows — free, no signup, no watermark." />
    <meta property="og:url" content="https://creestion.pages.dev/generator/" />
    <meta property="og:image" content="https://creestion.pages.dev/screenshots/hero-studio.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Match the landing page's theme before paint: shared key, then OS.
      try {
        var t = localStorage.getItem("creestion-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <title>Creestion Studio - Manual App Store Screenshot Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
